name: Sync YouTube lectures

on:
  schedule:
    # Mondays and Thursdays, 09:30 UTC (03:15 PM NPT): courses still running
    # add a lecture or two a week.
    - cron: "30 9 * * 1,4"
  workflow_dispatch:
  # A merged change to the sync or a course file (say, a new playlist) runs
  # it right away instead of waiting for the schedule. Pull requests can't
  # run it: the key's environment only admits main, and the unit tests
  # already run in CI.
  push:
    branches: [main]
    paths:
      - "packages/youtube/**"
      - "!packages/youtube/data/**"
      - "apps/web/src/content/resources/**"
      - ".github/workflows/sync-youtube.yml"

permissions:
  contents: write
  pull-requests: write

# The PR commit must not trigger the lint-staged pre-commit hook.
env:
  HUSKY: "0"

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Holds YOUTUBE_API_KEY; its branch policy allows main only.
    environment: youtube-sync
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh lectures
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bun run sync:youtube

      # A no-op when no lecture changed.
      - name: Open pull request on change
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/youtube-snapshot
          base: main
          commit-message: "chore(data): refresh YouTube lectures"
          title: "chore(data): refresh YouTube lectures"
          body: |
            Automated refresh of `packages/youtube/data/youtube.json`: new or
            changed lectures in the course playlists on /resources.
          labels: automated, data
          reviewers: bhimrazy
          delete-branch: true
