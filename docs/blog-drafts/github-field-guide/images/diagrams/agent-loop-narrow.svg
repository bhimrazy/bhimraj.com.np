<rect class="n" x="16" y="16" width="170" height="50" rx="10"/><text class="t" x="30" y="38" text-anchor="start">Issue</text><text class="s" x="30" y="55" text-anchor="start">scoped by you</text><text class="cap" x="174" y="37" text-anchor="end">YOU</text><path class="ln" d="M60 68L60 77"/><path class="hd" d="M60 77L57.0 70.7L63.0 70.7Z"/><rect class="n" x="16" y="80" width="170" height="50" rx="10"/><text class="t" x="30" y="102" text-anchor="start">Agent</text><text class="s" x="30" y="119" text-anchor="start">own branch</text><text class="cap" x="174" y="101" text-anchor="end">AGENT</text><path class="ln" d="M60 132L60 141"/><path class="hd" d="M60 141L57.0 134.7L63.0 134.7Z"/><rect class="n" x="16" y="144" width="170" height="50" rx="10"/><text class="t" x="30" y="166" text-anchor="start">Draft PR</text><text class="s" x="30" y="183" text-anchor="start">never main</text><text class="cap" x="174" y="165" text-anchor="end">AGENT</text><path class="ln" d="M60 196L60 205"/><path class="hd" d="M60 205L57.0 198.7L63.0 198.7Z"/><rect class="n" x="16" y="208" width="170" height="50" rx="10"/><text class="t" x="30" y="230" text-anchor="start">CI checks</text><text class="s" x="30" y="247" text-anchor="start">same gates</text><text class="cap" x="174" y="229" text-anchor="end">ACTIONS</text><path class="ln" d="M60 260L60 269"/><path class="hd" d="M60 269L57.0 262.7L63.0 262.7Z"/><rect class="n on" x="16" y="272" width="170" height="50" rx="10"/><text class="t" x="30" y="294" text-anchor="start">Review</text><text class="s" x="30" y="311" text-anchor="start">human gate</text><text class="cap act" x="174" y="293" text-anchor="end">YOU</text><path class="ln" d="M60 324L60 333"/><path class="hd" d="M60 333L57.0 326.7L63.0 326.7Z"/><rect class="n" x="16" y="336" width="170" height="50" rx="10"/><text class="t" x="30" y="358" text-anchor="start">Merge</text><text class="s" x="30" y="375" text-anchor="start">you decide</text><text class="cap" x="174" y="357" text-anchor="end">YOU</text><path class="ln dash" d="M188 233L212.0 233.0Q222 233 222.0 223.0L222.0 121.0Q222 111 212.0 111.0L190 111"/><path class="hd" d="M190 111L196.3 108.0L196.3 114.0Z"/><path class="ln dash" d="M188 297L290.0 297.0Q300 297 300.0 287.0L300.0 109.0Q300 99 290.0 99.0L190 99"/><path class="hd" d="M190 99L196.3 96.0L196.3 102.0Z"/><rect class="n" style="fill:var(--bg)" x="197" y="153" width="50" height="38" rx="6"/><text class="m" x="222" y="171" text-anchor="middle">CI</text><text class="m" x="222" y="185" text-anchor="middle">fails</text><rect class="n" style="fill:var(--bg)" x="259" y="211" width="82" height="38" rx="6"/><text class="m" x="300" y="229" text-anchor="middle">changes</text><text class="m" x="300" y="243" text-anchor="middle">requested</text>
