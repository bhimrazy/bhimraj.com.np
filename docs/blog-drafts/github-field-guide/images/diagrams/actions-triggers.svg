<svg xmlns="http://www.w3.org/2000/svg" class="gf" viewBox="0 0 680 352" width="680" height="352" role="img" aria-labelledby="gf-actions-triggers-title gf-actions-triggers-desc">
<title id="gf-actions-triggers-title">What can start a GitHub Actions workflow</title>
<desc id="gf-actions-triggers-desc">Six triggers feed the on: block of a workflow file: push (you push commits), pull_request (a PR opens or updates), workflow_dispatch (the Run button or gh workflow run), schedule (a cron in UTC), repository_dispatch (an outside system calls the API), and workflow_call (another workflow calls this one).</desc>
<style>.gf{--f-bg:#ffffff;--f-bg2:#f5f5f4;--f-bg3:#e7e5e4;--f-tx:#1c1917;--f-tx2:#57534e;--f-tx3:#a8a29e;--f-ac:#d97706;--f-acs:rgba(217,119,6,0.08);--f-bd:#e7e5e4;--f-bdh:#d6d3d1;--f-act:#b45309;--f-node:#f5f5f4}
@media (prefers-color-scheme:dark){.gf{--f-bg:#17150f;--f-bg2:#16140f;--f-bg3:#1f1c16;--f-tx:#f5f0e8;--f-tx2:#a09882;--f-tx3:#706a58;--f-ac:#f59e0b;--f-acs:rgba(245,158,11,0.1);--f-bd:#2a2620;--f-bdh:#3a3530;--f-act:#f59e0b;--f-node:#1f1c16}}
:where(.light,[data-theme=light]) .gf{--f-bg:#ffffff;--f-bg2:#f5f5f4;--f-bg3:#e7e5e4;--f-tx:#1c1917;--f-tx2:#57534e;--f-tx3:#a8a29e;--f-ac:#d97706;--f-acs:rgba(217,119,6,0.08);--f-bd:#e7e5e4;--f-bdh:#d6d3d1;--f-act:#b45309;--f-node:#f5f5f4}
:where(.dark,[data-theme=dark]) .gf{--f-bg:#17150f;--f-bg2:#16140f;--f-bg3:#1f1c16;--f-tx:#f5f0e8;--f-tx2:#a09882;--f-tx3:#706a58;--f-ac:#f59e0b;--f-acs:rgba(245,158,11,0.1);--f-bd:#2a2620;--f-bdh:#3a3530;--f-act:#f59e0b;--f-node:#1f1c16}
.gf{--bg:var(--site-card-bg,var(--f-bg));--tx:var(--site-text,var(--f-tx));--tx2:var(--site-text-secondary,var(--f-tx2));--tx3:var(--site-text-tertiary,var(--f-tx3));--ac:var(--site-accent,var(--f-ac));--acs:var(--site-accent-subtle,var(--f-acs));--bd:var(--site-border,var(--f-bd));--bdh:var(--site-border-hover,var(--f-bdh));--node:var(--f-node);--act:var(--f-act)}
.gf .bg{fill:var(--bg)}
.gf .n{fill:var(--node);stroke:var(--bdh);stroke-width:1}
.gf .n.on{fill:var(--acs);stroke:var(--ac);stroke-width:1.5}
.gf .zone{fill:none;stroke:var(--bdh);stroke-width:1;stroke-dasharray:3 4}
.gf .ln{fill:none;stroke:var(--tx3);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.gf .ln.on{stroke:var(--ac);stroke-width:2}
.gf .ln.dim{stroke:var(--bdh)}
.gf .ln.dash{stroke-dasharray:4 4}
.gf .hd{fill:var(--tx3)}
.gf .hd.on{fill:var(--ac)}
.gf .hd.dim{fill:var(--bdh)}
.gf .dot{fill:var(--tx2)}
.gf .dot.on{fill:var(--ac)}
.gf .ring{fill:var(--bg);stroke:var(--tx3);stroke-width:1.5}
.gf .ring.on{stroke:var(--ac);stroke-width:2}
.gf .ac{fill:var(--ac)}
.gf text{font-family:var(--font-body,"DM Sans"),system-ui,sans-serif;fill:var(--tx)}
.gf .t{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:600;font-size:14px;fill:var(--tx)}
.gf .tl{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:700;font-size:18px;fill:var(--tx)}
.gf .s{font-size:12px;fill:var(--tx2)}
.gf .m{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:11px;fill:var(--tx2)}
.gf .mk{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:12px;fill:var(--tx)}
.gf .cap{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;fill:var(--tx2)}
.gf .act{fill:var(--act)}
.gf .big{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:700;font-size:22px}</style>
<rect class="bg" width="680" height="352" rx="12"/>
<text class="cap" x="20" y="72" text-anchor="start">WHAT FIRES IT</text><rect class="n on" x="376" y="44" width="288" height="292" rx="12"/><text class="m" x="394" y="68" text-anchor="start"># .github/workflows/ci.yml</text><text class="mk act" x="394" y="90" text-anchor="start" font-weight="600">on:</text><rect class="n" x="16" y="100" width="290" height="32" rx="8"/><text class="cap" x="28" y="120" text-anchor="start">REPO</text><text class="s" x="108" y="120" text-anchor="start">you push commits</text><path class="ln" d="M308 116L372 116"/><path class="hd" d="M372 116L365.7 119.0L365.7 113.0Z"/><text class="mk" x="410" y="120" text-anchor="start">push:</text><text class="m" x="454.25" y="120" text-anchor="start">branches: [main]</text><rect class="n" x="16" y="140" width="290" height="32" rx="8"/><text class="cap" x="28" y="160" text-anchor="start">REPO</text><text class="s" x="108" y="160" text-anchor="start">a PR is opened or updated</text><path class="ln" d="M308 156L372 156"/><path class="hd" d="M372 156L365.7 159.0L365.7 153.0Z"/><text class="mk" x="410" y="160" text-anchor="start">pull_request:</text><rect class="n" x="16" y="180" width="290" height="32" rx="8"/><text class="cap" x="28" y="200" text-anchor="start">YOU</text><text class="s" x="108" y="200" text-anchor="start">Run button or gh workflow run</text><path class="ln" d="M308 196L372 196"/><path class="hd" d="M372 196L365.7 199.0L365.7 193.0Z"/><text class="mk" x="410" y="200" text-anchor="start">workflow_dispatch:</text><rect class="n" x="16" y="220" width="290" height="32" rx="8"/><text class="cap" x="28" y="240" text-anchor="start">CLOCK</text><text class="s" x="108" y="240" text-anchor="start">a cron schedule, in UTC</text><path class="ln" d="M308 236L372 236"/><path class="hd" d="M372 236L365.7 239.0L365.7 233.0Z"/><text class="mk" x="410" y="240" text-anchor="start">schedule:</text><text class="m" x="483.25" y="240" text-anchor="start">- cron: "0 3 * * *"</text><rect class="n" x="16" y="260" width="290" height="32" rx="8"/><text class="cap" x="28" y="280" text-anchor="start">API</text><text class="s" x="108" y="280" text-anchor="start">an outside system calls in</text><path class="ln" d="M308 276L372 276"/><path class="hd" d="M372 276L365.7 279.0L365.7 273.0Z"/><text class="mk" x="410" y="280" text-anchor="start">repository_dispatch:</text><text class="m" x="563" y="280" text-anchor="start">types: [sync]</text><rect class="n" x="16" y="300" width="290" height="32" rx="8"/><text class="cap" x="28" y="320" text-anchor="start">WORKFLOW</text><text class="s" x="108" y="320" text-anchor="start">another workflow calls this one</text><path class="ln" d="M308 316L372 316"/><path class="hd" d="M372 316L365.7 319.0L365.7 313.0Z"/><text class="mk" x="410" y="320" text-anchor="start">workflow_call:</text>
</svg>
