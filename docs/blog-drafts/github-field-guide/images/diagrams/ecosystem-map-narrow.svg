<svg xmlns="http://www.w3.org/2000/svg" class="gf" viewBox="0 0 360 520" width="360" height="520" role="img" aria-labelledby="gf-ecosystem-map-sm-title gf-ecosystem-map-sm-desc">
<title id="gf-ecosystem-map-sm-title">The GitHub ecosystem at a glance</title>
<desc id="gf-ecosystem-map-sm-desc">Git keeps history on your machine, edited through VS Code. Git pushes and pulls to GitHub, the shared remote that holds repositories, issues, pull requests and releases. The gh CLI talks to GitHub's API. GitHub sends events to Actions runners and issues to AI agents; they report status and open pull requests back.</desc>
<style>.gf{--f-bg:#ffffff;--f-bg2:#f5f5f4;--f-bg3:#e7e5e4;--f-tx:#1c1917;--f-tx2:#57534e;--f-tx3:#a8a29e;--f-ac:#d97706;--f-acs:rgba(217,119,6,0.08);--f-bd:#e7e5e4;--f-bdh:#d6d3d1;--f-act:#b45309;--f-node:#f5f5f4}
@media (prefers-color-scheme:dark){.gf{--f-bg:#17150f;--f-bg2:#16140f;--f-bg3:#1f1c16;--f-tx:#f5f0e8;--f-tx2:#a09882;--f-tx3:#706a58;--f-ac:#f59e0b;--f-acs:rgba(245,158,11,0.1);--f-bd:#2a2620;--f-bdh:#3a3530;--f-act:#f59e0b;--f-node:#1f1c16}}
:where(.light,[data-theme=light]) .gf{--f-bg:#ffffff;--f-bg2:#f5f5f4;--f-bg3:#e7e5e4;--f-tx:#1c1917;--f-tx2:#57534e;--f-tx3:#a8a29e;--f-ac:#d97706;--f-acs:rgba(217,119,6,0.08);--f-bd:#e7e5e4;--f-bdh:#d6d3d1;--f-act:#b45309;--f-node:#f5f5f4}
:where(.dark,[data-theme=dark]) .gf{--f-bg:#17150f;--f-bg2:#16140f;--f-bg3:#1f1c16;--f-tx:#f5f0e8;--f-tx2:#a09882;--f-tx3:#706a58;--f-ac:#f59e0b;--f-acs:rgba(245,158,11,0.1);--f-bd:#2a2620;--f-bdh:#3a3530;--f-act:#f59e0b;--f-node:#1f1c16}
.gf{--bg:var(--site-card-bg,var(--f-bg));--tx:var(--site-text,var(--f-tx));--tx2:var(--site-text-secondary,var(--f-tx2));--tx3:var(--site-text-tertiary,var(--f-tx3));--ac:var(--site-accent,var(--f-ac));--acs:var(--site-accent-subtle,var(--f-acs));--bd:var(--site-border,var(--f-bd));--bdh:var(--site-border-hover,var(--f-bdh));--node:var(--f-node);--act:var(--f-act)}
.gf .bg{fill:var(--bg)}
.gf .n{fill:var(--node);stroke:var(--bdh);stroke-width:1}
.gf .n.on{fill:var(--acs);stroke:var(--ac);stroke-width:1.5}
.gf .zone{fill:none;stroke:var(--bdh);stroke-width:1;stroke-dasharray:3 4}
.gf .ln{fill:none;stroke:var(--tx3);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.gf .ln.on{stroke:var(--ac);stroke-width:2}
.gf .ln.dim{stroke:var(--bdh)}
.gf .ln.dash{stroke-dasharray:4 4}
.gf .hd{fill:var(--tx3)}
.gf .hd.on{fill:var(--ac)}
.gf .hd.dim{fill:var(--bdh)}
.gf .dot{fill:var(--tx2)}
.gf .dot.on{fill:var(--ac)}
.gf .ring{fill:var(--bg);stroke:var(--tx3);stroke-width:1.5}
.gf .ring.on{stroke:var(--ac);stroke-width:2}
.gf .ac{fill:var(--ac)}
.gf text{font-family:var(--font-body,"DM Sans"),system-ui,sans-serif;fill:var(--tx)}
.gf .t{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:600;font-size:14px;fill:var(--tx)}
.gf .tl{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:700;font-size:18px;fill:var(--tx)}
.gf .s{font-size:12px;fill:var(--tx2)}
.gf .m{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:11px;fill:var(--tx2)}
.gf .mk{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:12px;fill:var(--tx)}
.gf .cap{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;fill:var(--tx2)}
.gf .act{fill:var(--act)}
.gf .big{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:700;font-size:22px}</style>
<rect class="bg" width="360" height="520" rx="12"/>
