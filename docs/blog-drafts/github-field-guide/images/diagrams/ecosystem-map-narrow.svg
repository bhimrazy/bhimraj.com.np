308" text-anchor="middle">repositories</text><rect class="n" x="184" y="291" width="148" height="26" rx="13"/><text class="mk" x="258" y="308" text-anchor="middle">issues</text><rect class="n" x="28" y="325" width="148" height="26" rx="13"/><text class="mk" x="102" y="342" text-anchor="middle">pull requests</text><rect class="n" x="184" y="325" width="148" height="26" rx="13"/><text class="mk" x="258" y="342" text-anchor="middle">releases</text><path class="ln" d="M60 364L60 420"/><path class="hd" d="M60 420L57.0 413.7L63.0 413.7Z"/><text class="m" x="66" y="396" text-anchor="start">event</text><path class="ln" d="M124 418L124 366"/><path class="hd" d="M124 366L127.0 372.3L121.0 372.3Z"/><text class="m" x="130" y="396" text-anchor="start">status</text><path class="ln" d="M236 364L236 420"/><path class="hd" d="M236 420L233.0 413.7L239.0 413.7Z"/><text class="m" x="242" y="396" text-anchor="start">issue</text><path class="ln" d="M300 418L300 366"/><path class="hd" d="M300 366L303.0 372.3L297.0 372.3Z"/><text class="m" x="306" y="396" text-anchor="start">PR</text><rect class="n" x="12" y="422" width="160" height="86" rx="10"/><text class="t" x="92" y="453" text-anchor="middle">Actions</text><text class="s" x="92" y="469" text-anchor="middle">runners do CI/CD</text><text class="s" x="92" y="485" text-anchor="middle">on every event</text><rect class="n" x="188" y="422" width="160" height="86" rx="10"/><text class="t" x="268" y="453" text-anchor="middle">AI agents</text><text class="s" x="268" y="469" text-anchor="middle">Copilot · Claude · Codex</text><text class="s" x="268" y="485" text-anchor="middle">issue in, PR out</text>
</svg>
