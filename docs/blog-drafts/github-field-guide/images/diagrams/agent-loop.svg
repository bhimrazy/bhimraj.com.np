<text class="cap" x="65" y="36" text-anchor="middle">YOU</text><rect class="n" x="21" y="48" width="88" height="64" rx="10"/><text class="t" x="65" y="76" text-anchor="middle">Issue</text><text class="s" x="65" y="92" text-anchor="middle">scoped by you</text><path class="ln" d="M111 80L128 80"/><path class="hd" d="M128 80L121.7 83.0L121.7 77.0Z"/><text class="cap" x="175" y="36" text-anchor="middle">AGENT</text><rect class="n" x="131" y="48" width="88" height="64" rx="10"/><text class="t" x="175" y="76" text-anchor="middle">Agent</text><text class="s" x="175" y="92" text-anchor="middle">own branch</text><path class="ln" d="M221 80L238 80"/><path class="hd" d="M238 80L231.7 83.0L231.7 77.0Z"/><text class="cap" x="285" y="36" text-anchor="middle">AGENT</text><rect class="n" x="241" y="48" width="88" height="64" rx="10"/><text class="t" x="285" y="76" text-anchor="middle">Draft PR</text><text class="s" x="285" y="92" text-anchor="middle">never main</text><path class="ln" d="M331 80L348 80"/><path class="hd" d="M348 80L341.7 83.0L341.7 77.0Z"/><text class="cap" x="395" y="36" text-anchor="middle">ACTIONS</text><rect class="n" x="351" y="48" width="88" height="64" rx="10"/><text class="t" x="395" y="76" text-anchor="middle">CI checks</text><text class="s" x="395" y="92" text-anchor="middle">same gates</text><path class="ln" d="M441 80L458 80"/><path class="hd" d="M458 80L451.7 83.0L451.7 77.0Z"/><text class="cap act" x="505" y="36" text-anchor="middle">YOU</text><rect class="n on" x="461" y="48" width="88" height="64" rx="10"/><text class="t" x="505" y="76" text-anchor="middle">Review</text><text class="s" x="505" y="92" text-anchor="middle">human gate</text><path class="ln" d="M551 80L568 80"/><path class="hd" d="M568 80L561.7 83.0L561.7 77.0Z"/><text class="cap" x="615" y="36" text-anchor="middle">YOU</text><rect class="n" x="571" y="48" width="88" height="64" rx="10"/><text class="t" x="615" y="76" text-anchor="middle">Merge</text><text class="s" x="615" y="92" text-anchor="middle">you decide</text><path class="ln dash" d="M395 114L395.0 138.0Q395 148 385.0 148.0L197.0 148.0Q187 148 187.0 138.0L187 116"/><path class="hd" d="M187 116L190.0 122.3L184.0 122.3Z"/><text class="m" x="291" y="166" text-anchor="middle">CI fails → agent pushes a fix</text><path class="ln dash" d="M505 114L505.0 186.0Q505 196 495.0 196.0L173.0 196.0Q163 196 163.0 186.0L163 116"/><path class="hd" d="M163 116L166.0 122.3L160.0 122.3Z"/><text class="m" x="334" y="214" text-anchor="middle">changes requested → agent revises</text>
</svg>
