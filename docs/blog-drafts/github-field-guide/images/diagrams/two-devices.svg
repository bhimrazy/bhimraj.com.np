" y="192" text-anchor="middle">settings · extensions</text><path class="ln" d="M168 180L248 180"/><path class="hd" d="M248 180L241.7 183.0L241.7 177.0Z"/><text class="m" x="202" y="172" text-anchor="middle">sign in</text><path class="ln" d="M432 180L510 180"/><path class="hd" d="M510 180L503.7 183.0L503.7 177.0Z"/><text class="m" x="477" y="172" text-anchor="middle">sign in</text><rect class="n" x="252" y="236" width="176" height="64" rx="10"/><text class="t" x="340" y="264" text-anchor="middle">wip/* branch</text><text class="m" x="340" y="280" text-anchor="middle">unfinished work</text><path class="ln" d="M168 268L248 268"/><path class="hd" d="M248 268L241.7 271.0L241.7 265.0Z"/><text class="m" x="202" y="260" text-anchor="middle">push</text><path class="ln" d="M432 268L510 268"/><path class="hd" d="M510 268L503.7 271.0L503.7 265.0Z"/><text class="m" x="477" y="260" text-anchor="middle">pull</text>
