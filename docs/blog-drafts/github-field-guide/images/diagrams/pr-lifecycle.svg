<svg xmlns="http://www.w3.org/2000/svg" class="gf" viewBox="0 0 680 290" width="680" height="290" role="img" aria-labelledby="gf-pr-lifecycle-title gf-pr-lifecycle-desc">
<title id="gf-pr-lifecycle-title">The pull request lifecycle</title>
<desc id="gf-pr-lifecycle-desc">A feature branch leaves main, collects commits, opens pull request 42, passes three checks, gets approved, merges back into main, and a later commit on main is tagged v1.4.0 and released. Each step lists its command: git switch -c, git commit, gh pr create, CI runs, gh pr review, gh pr merge, gh release create.</desc>
<style>.gf{--f-bg:#ffffff;--f-bg2:#f5f5f4;--f-bg3:#e7e5e4;--f-tx:#1c1917;--f-tx2:#57534e;--f-tx3:#a8a29e;--f-ac:#d97706;--f-acs:rgba(217,119,6,0.08);--f-bd:#e7e5e4;--f-bdh:#d6d3d1;--f-act:#b45309;--f-node:#f5f5f4}
@media (prefers-color-scheme:dark){.gf{--f-bg:#17150f;--f-bg2:#16140f;--f-bg3:#1f1c16;--f-tx:#f5f0e8;--f-tx2:#a09882;--f-tx3:#706a58;--f-ac:#f59e0b;--f-acs:rgba(245,158,11,0.1);--f-bd:#2a2620;--f-bdh:#3a3530;--f-act:#f59e0b;--f-node:#1f1c16}}
:where(.light,[data-theme=light]) .gf{--f-bg:#ffffff;--f-bg2:#f5f5f4;--f-bg3:#e7e5e4;--f-tx:#1c1917;--f-tx2:#57534e;--f-tx3:#a8a29e;--f-ac:#d97706;--f-acs:rgba(217,119,6,0.08);--f-bd:#e7e5e4;--f-bdh:#d6d3d1;--f-act:#b45309;--f-node:#f5f5f4}
:where(.dark,[data-theme=dark]) .gf{--f-bg:#17150f;--f-bg2:#16140f;--f-bg3:#1f1c16;--f-tx:#f5f0e8;--f-tx2:#a09882;--f-tx3:#706a58;--f-ac:#f59e0b;--f-acs:rgba(245,158,11,0.1);--f-bd:#2a2620;--f-bdh:#3a3530;--f-act:#f59e0b;--f-node:#1f1c16}
.gf{--bg:var(--site-card-bg,var(--f-bg));--tx:var(--site-text,var(--f-tx));--tx2:var(--site-text-secondary,var(--f-tx2));--tx3:var(--site-text-tertiary,var(--f-tx3));--ac:var(--site-accent,var(--f-ac));--acs:var(--site-accent-subtle,var(--f-acs));--bd:var(--site-border,var(--f-bd));--bdh:var(--site-border-hover,var(--f-bdh));--node:var(--f-node);--act:var(--f-act)}
.gf .bg{fill:var(--bg)}
.gf .n{fill:var(--node);stroke:var(--bdh);stroke-width:1}
.gf .n.on{fill:var(--acs);stroke:var(--ac);stroke-width:1.5}
.gf .zone{fill:none;stroke:var(--bdh);stroke-width:1;stroke-dasharray:3 4}
.gf .ln{fill:none;stroke:var(--tx3);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.gf .ln.on{stroke:var(--ac);stroke-width:2}
.gf .ln.dim{stroke:var(--bdh)}
.gf .ln.dash{stroke-dasharray:4 4}
.gf .hd{fill:var(--tx3)}
.gf .hd.on{fill:var(--ac)}
.gf .hd.dim{fill:var(--bdh)}
.gf .dot{fill:var(--tx2)}
.gf .dot.on{fill:var(--ac)}
.gf .ring{fill:var(--bg);stroke:var(--tx3);stroke-width:1.5}
.gf .ring.on{stroke:var(--ac);stroke-width:2}
.gf .ac{fill:var(--ac)}
.gf text{font-family:var(--font-body,"DM Sans"),system-ui,sans-serif;fill:var(--tx)}
.gf .t{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:600;font-size:14px;fill:var(--tx)}
.gf .tl{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:700;font-size:18px;fill:var(--tx)}
.gf .s{font-size:12px;fill:var(--tx2)}
.gf .m{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:11px;fill:var(--tx2)}
.gf .mk{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:12px;fill:var(--tx)}
.gf .cap{font-family:var(--font-mono,"JetBrains Mono"),ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;fill:var(--tx2)}
.gf .act{fill:var(--act)}
.gf .big{font-family:var(--font-display,"Space Grotesk"),system-ui,sans-serif;font-weight:700;font-size:22px}</style>
<rect class="bg" width="680" height="290" rx="12"/>
<text class="cap" x="50" y="30" text-anchor="middle">01</text><text class="t" x="50" y="50" text-anchor="middle">Branch</text><text class="m" x="50" y="68" text-anchor="middle">git switch -c</text><text class="cap" x="145" y="30" text-anchor="middle">02</text><text class="t" x="145" y="50" text-anchor="middle">Commit</text><text class="m" x="145" y="68" text-anchor="middle">git commit</text><text class="cap" x="240" y="30" text-anchor="middle">03</text><text class="t" x="240" y="50" text-anchor="middle">Open PR</text><text class="m" x="240" y="68" text-anchor="middle">gh pr create</text><text class="cap" x="335" y="30" text-anchor="middle">04</text><text class="t" x="335" y="50" text-anchor="middle">Checks</text><text class="m" x="335" y="68" text-anchor="middle">CI runs</text><text class="cap" x="430" y="30" text-anchor="middle">05</text><text class="t" x="430" y="50" text-anchor="middle">Review</text><text class="m" x="430" y="68" text-anchor="middle">gh pr review</text><text class="cap" x="525" y="30" text-anchor="middle">06</text><text class="t" x="525" y="50" text-anchor="middle">Merge</text><text class="m" x="525" y="68" text-anchor="middle">gh pr merge</text><text class="cap" x="620" y="30" text-anchor="middle">07</text><text class="t" x="620" y="50" text-anchor="middle">Release</text><text class="m" x="620" y="68" text-anchor="middle">gh release</text><text class="m" x="620" y="82" text-anchor="middle">create</text><path class="ln dim dash" d="M50 80L50 226"/><path class="ln dim dash" d="M145 80L145 144"/><path class="ln dim dash" d="M240 80L240 140"/><path class="ln dim dash" d="M335 80L335 140"/><path class="ln dim dash" d="M430 80L430 140"/><path class="ln dim dash" d="M525 80L525 224"/><path class="ln dim dash" d="M620 92L620 226"/><path class="ln" d="M16 236L664 236"/><text class="m" x="16" y="258" text-anchor="start">main</text><path class="ln on" d="M50 236C70 236 70 156 95 156L475 156C500 156 500 236 525 236"/><text class="m act" x="100" y="180" text-anchor="start">feat/login</text><circle class="dot" cx="50" cy="236" r="4.5"/><circle class="dot" cx="300" cy="236" r="3.5"/><circle class="dot on" cx="120" cy="156" r="4.5"/><circle class="dot on" cx="145" cy="156" r="4.5"/><circle class="dot on" cx="170" cy="156" r="4.5"/><rect class="n" x="207" y="143" width="66" height="26" rx="13"/><text class="mk" x="240" y="160" text-anchor="middle">PR #42</text><rect class="n" x="302" y="143" width="66" height="26" rx="13"/><text class="mk" x="335" y="160" text-anchor="middle">3/3 ✓</text><rect class="n" x="390" y="143" width="80" height="26" rx="13"/><text class="mk" x="430" y="160" text-anchor="middle">approved</text><circle class="ring on" cx="525" cy="236" r="7"/><circle class="dot" cx="620" cy="236" r="4.5"/><path class="n" d="M620 250l9 9h30v24h-78v-24h30z"/><text class="mk" x="620" y="276" text-anchor="middle">v1.4.0</text>
</svg>
